name: GPR revenue Community v5
on:
  push:
    paths:
      - '.github/workflows/gpr-revenue-community-v5.yml'
      - 'scripts/gpr_revenue_community_v5.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpr-revenue-community-single-device
  cancel-in-progress: false
jobs:
  revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current Community client
        run: python -m pip install --upgrade --extra-index-url https://vnstocks.com/api/packages 'vnstock>=5.0.1,<6' pandas
      - uses: actions/cache@v4
        with:
          path: output/gpr_revenue_community
          key: gpr-revenue-community-v5-${{ github.run_id }}
          restore-keys: gpr-revenue-community-v5-
      - name: Collect net revenue with account rights and checkpoints
        run: python scripts/gpr_revenue_community_v5.py
      - name: Summary
        if: always()
        run: |
          if [ -f output/gpr_revenue_community/summary.json ]; then
            cat output/gpr_revenue_community/summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-revenue-community-v5
          path: output/gpr_revenue_community/
          retention-days: 30
          if-no-files-found: warn
