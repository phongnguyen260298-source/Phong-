name: GPR TopTercile DID reconcile v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpr-toptercile-did-reconcile-v1.yml'
      - 'scripts/gpr_toptercile_did_reconcile_v1.py'

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' scipy statsmodels linearmodels pyarrow openpyxl
      - name: Download locked VCI v4.2 fundamental artifact
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact CFO panel
        run: python scripts/build_cfo_linkage_panel.py
      - name: Run TopTercile reconciliation and DID
        run: python scripts/gpr_toptercile_did_reconcile_v1.py
      - name: QA gate
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          o=Path('data/gpr_toptercile_did_reconcile_v1'); q=json.loads((o/'qa_summary.json').read_text()); r=pd.read_csv(o/'results.csv')
          assert q['panel_symbols']>=570 and q['overlap_symbols']>=300
          assert q['duplicates']==0 and q['primary_treated_firms']>80 and q['primary_control_firms']>150
          assert r['p'].notna().sum()>=10
          print('QA PASS',q)
          PY
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_toptercile_did_reconcile_v1/ || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add TopTercile DID reconciliation results'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-toptercile-did-reconcile-v1-results
          path: data/gpr_toptercile_did_reconcile_v1/
          retention-days: 30
