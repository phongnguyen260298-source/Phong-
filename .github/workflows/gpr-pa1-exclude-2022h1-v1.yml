name: GPR PA1 exclude 2022H1 v1
on:
  push:
    paths:
      - '.github/workflows/gpr-pa1-exclude-2022h1-v1.yml'
      - 'scripts/gpr_pa1_exclude_2022h1_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pa1-exclude-2022h1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download refreshed fundamentals artifact
        uses: actions/download-artifact@v4
        with:
          name: gpr-bronze-refresh-raw
          path: data/gpr_bronze_refresh
          repository: phongnguyen260298-source/Phong-
          run-id: 34582712489
          github-token: ${{ github.token }}
      - name: Install analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy<2.3' pyarrow scipy linearmodels statsmodels
      - name: Normalize fundamental artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gpr_bronze_refresh/fundamental_shards
          while IFS= read -r f; do
            parent=$(dirname "$f")
            if [ "$parent" != "data/gpr_bronze_refresh/fundamental_shards" ]; then cp "$f" data/gpr_bronze_refresh/fundamental_shards/; fi
          done < <(find data/gpr_bronze_refresh -name 'fundamental_shard_*.parquet')
          test "$(find data/gpr_bronze_refresh/fundamental_shards -name 'fundamental_shard_*.parquet' | wc -l)" -eq 4
      - name: Run exclusion test
        run: python scripts/gpr_pa1_exclude_2022h1_v1.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_pa1_exclude_2022h1_v1
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add PA1 exclude 2022H1 result'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: gpr-pa1-exclude-2022h1-v1
          path: data/gpr_pa1_exclude_2022h1_v1/
          retention-days: 30