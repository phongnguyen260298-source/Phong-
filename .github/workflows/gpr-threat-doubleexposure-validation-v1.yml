name: GPR Threat DoubleExposure validation v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpr-threat-doubleexposure-validation-v1.yml'
      - 'scripts/gpr_threat_doubleexposure_validation_v1.py'

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' scipy statsmodels linearmodels pyarrow openpyxl
      - name: Download completed market artifact
        uses: actions/download-artifact@v4
        with:
          name: gpr-market-from-bronze-final
          path: input/completed_market
          repository: phongnguyen260298-source/Phong-
          run-id: 34463852474
          github-token: ${{ github.token }}
      - name: Restore completed market outputs
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find input/completed_market -type f -name 'daily_price_panel.csv.gz' -print -quit)"
          test -n "$SRC"
          SRC_DIR="$(dirname "$SRC")"
          mkdir -p data/gpr_market_top5_v4
          cp -a "$SRC_DIR"/. data/gpr_market_top5_v4/
          test -f data/gpr_market_top5_v4/top_event_dates.csv
      - name: Download locked VCI v4.2 fundamental artifact
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ github.token }}
      - name: Build CFO panel
        run: python scripts/build_cfo_linkage_panel.py
      - name: Run prespecified Threat DoubleExposure validation
        run: python scripts/gpr_threat_doubleexposure_validation_v1.py
      - name: QA gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          root=Path('data/gpr_threat_doubleexposure_validation_v1')
          qa=json.loads((root/'qa_summary.json').read_text())
          r=pd.read_csv(root/'results.csv')
          assert qa['price_symbols'] >= 500, qa
          assert qa['duplicate_symbol_quarter_cfo'] == 0, qa
          assert qa['treated_symbols'] > 50 and qa['control_symbols'] > 50, qa
          assert qa['threat_events'] >= 5, qa
          assert {'car1','car5','car20','pre5','reverse_timing_car5'}.issubset(set(r.test)), r.test.tolist()
          assert r.loc[r.test=='car5','p_interaction'].notna().all()
          print(json.dumps(qa,ensure_ascii=False,indent=2))
          print(r.to_string(index=False))
          PY
      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_threat_doubleexposure_validation_v1/ || true
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add Threat DoubleExposure validation results'
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-threat-doubleexposure-validation-v1-results
          path: data/gpr_threat_doubleexposure_validation_v1/
          retention-days: 30
