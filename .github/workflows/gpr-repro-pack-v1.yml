name: GPR reproducibility pack v1
on:
  push:
    paths:
      - '.github/workflows/gpr-repro-pack-v1.yml'
      - 'scripts/build_gpr_repro_pack_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download refreshed fundamentals artifact
        uses: actions/download-artifact@v4
        with:
          name: gpr-bronze-refresh-raw
          path: data/gpr_bronze_refresh
          repository: phongnguyen260298-source/Phong-
          run-id: 34582712489
          github-token: ${{ github.token }}
      - name: Install stack
        run: python -m pip install 'pandas>=2.2,<3' 'numpy<2.3' pyarrow
      - name: Normalize fundamentals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gpr_bronze_refresh/fundamental_shards
          while IFS= read -r f; do
            parent=$(dirname "$f")
            if [ "$parent" != "data/gpr_bronze_refresh/fundamental_shards" ]; then cp "$f" data/gpr_bronze_refresh/fundamental_shards/; fi
          done < <(find data/gpr_bronze_refresh -name 'fundamental_shard_*.parquet')
          test "$(find data/gpr_bronze_refresh/fundamental_shards -name 'fundamental_shard_*.parquet' | wc -l)" -eq 4
      - name: Build reproducibility source data
        run: python scripts/build_gpr_repro_pack_v1.py
      - name: Show metadata
        run: cat data/gpr_repro_pack_v1/metadata.json
      - name: Upload reproducibility source data
        uses: actions/upload-artifact@v4
        with:
          name: gpr-repro-pack-v1
          path: data/gpr_repro_pack_v1/
          retention-days: 30
