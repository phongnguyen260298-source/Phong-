name: VCI v4.2 X-Y Screen v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vci-xy-screen-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels linearmodels pyarrow openpyxl
      - name: Download VCI v4.2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/vci42
          gh run download 34329813990 -n vn-research-v42-vci-full -D input/vci42
      - name: Hotfix VCI labels, exposure, and official GPR columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/vci_xy_screen_v1.py')
          s=p.read_text()
          old="""def match(name, keys):\n    z=normtxt(name)\n    for k in keys:\n"""
          new="""def match(name, keys):\n    z=normtxt(name)\n    if 'cfo' in keys and ('luu chuyen tien' in z or 'dong tien' in z) and ('kinh doanh' in z or 'hdkd' in z or 'hoat dong kd' in z) and ('thuan' in z or 'rong' in z): return 'cfo'\n    if 'capex' in keys and ('mua sam' in z or 'mua' in z) and ('tscd' in z or 'tai san co dinh' in z or 'tai san dai han' in z) and ('chi' in z or 'tien' in z): return 'capex'\n    for k in keys:\n"""
          if old in s:
              s=s.replace(old,new)
          s=s.replace("pre['fixed_exp']=pre.fixed_assets/pre.assets;", "pre['fixed_exp']=pre['capex'].abs()/pre.assets;")
          start=s.index("shock_cols={")
          end=s.index("if any(v is None", start)
          fixed="""shock_cols={\n'AI_GPR':'GPR_AI',\n'GPR_AER':'GPR_AER',\n'GPR_THREATS':'THREATS_GPR_AI',\n'GPR_ACTS':'ACTS_GPR_AI'}\n"""
          s=s[:start]+fixed+s[end:]
          p.write_text(s)
          PY
      - name: Run 20-pair screen
        run: python scripts/vci_xy_screen_v1.py
      - name: Upload screening pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vci-v42-xy-screen-v1
          path: output/xy_screen/
          retention-days: 90
          compression-level: 6
