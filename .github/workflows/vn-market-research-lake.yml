name: VN Market Research Lake

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Extraction mode"
        required: true
        default: "universe"
        type: choice
        options:
          - universe
          - core
          - notes
          - trading
          - macro
      batch_index:
        description: "0-based batch index; ignored for universe/macro"
        required: true
        default: "0"
        type: string
      batch_size:
        description: "Symbols per run"
        required: true
        default: "25"
        type: string
      symbol:
        description: "Optional single ticker override, e.g. HPG"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/dispatch/vn-market-research-lake.json"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VN_RESEARCH_DELAY: "0.25"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request parameters
        id: params
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BATCH_INDEX: ${{ inputs.batch_index }}
          INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
          INPUT_SYMBOL: ${{ inputs.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              data = {
                  "mode": os.environ.get("INPUT_MODE") or "universe",
                  "batch_index": os.environ.get("INPUT_BATCH_INDEX") or "0",
                  "batch_size": os.environ.get("INPUT_BATCH_SIZE") or "25",
                  "symbol": os.environ.get("INPUT_SYMBOL") or "",
              }
          else:
              cfg = Path(".github/dispatch/vn-market-research-lake.json")
              data = json.loads(cfg.read_text(encoding="utf-8"))

          mode = str(data.get("mode", "universe")).strip().lower()
          if mode not in {"universe", "core", "notes", "trading", "macro"}:
              raise SystemExit(f"Invalid mode: {mode}")

          batch_index = int(data.get("batch_index", 0))
          batch_size = int(data.get("batch_size", 25))
          if batch_index < 0:
              raise SystemExit("batch_index must be >= 0")
          if batch_size < 1 or batch_size > 200:
              raise SystemExit("batch_size must be between 1 and 200")

          symbol = str(data.get("symbol", "")).upper().strip()
          if symbol and not re.fullmatch(r"[A-Z0-9]{3,10}", symbol):
              raise SystemExit(f"Invalid symbol: {symbol}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"mode={mode}", file=f)
              print(f"batch_index={batch_index}", file=f)
              print(f"batch_size={batch_size}", file=f)
              print(f"symbol={symbol}", file=f)

          print(json.dumps({
              "event": event,
              "mode": mode,
              "batch_index": batch_index,
              "batch_size": batch_size,
              "symbol": symbol,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API key
        shell: bash
        run: |
          if [ -z "$VNSTOCK_API_KEY" ]; then
            echo "::error::VNSTOCK_API_KEY repository secret is missing"
            exit 2
          fi

      - name: Install VNStock Bronze
        shell: bash
        run: |
          set -euo pipefail
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"

          python -m pip install --upgrade pip requests setuptools wheel
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
          chmod +x installer.run
          ./installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$VENV_PATH" --language en

          "$VENV_PATH/bin/python" -m ensurepip --upgrade
          "$VENV_PATH/bin/python" -m pip install \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<2.3" \
            pyarrow \
            openpyxl \
            requests

          "$VENV_PATH/bin/python" - <<'PY'
          import vnstock_data
          from vnstock_data import Finance, Listing, Macro, Quote, Reference, Trading
          print("VNStock sponsored environment OK")
          print("Finance:", Finance)
          PY

      - name: Extract research lake batch
        shell: bash
        run: |
          set -euo pipefail
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"
          "$VENV_PATH/bin/python" scripts/vn_market_research_lake.py \
            --mode "${{ steps.params.outputs.mode }}" \
            --batch-index "${{ steps.params.outputs.batch_index }}" \
            --batch-size "${{ steps.params.outputs.batch_size }}" \
            --symbol "${{ steps.params.outputs.symbol }}" \
            --out output/vn_research_lake

      - name: Show summary
        if: always()
        shell: bash
        run: |
          if [ -f output/vn_research_lake/run_summary.json ]; then
            cat output/vn_research_lake/run_summary.json
          fi
          if [ -f output/vn_research_lake/errors.csv ]; then
            echo "--- ERRORS (first 50 lines) ---"
            head -50 output/vn_research_lake/errors.csv || true
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn-research-${{ steps.params.outputs.mode }}-b${{ steps.params.outputs.batch_index }}
          path: output/vn_research_lake/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
