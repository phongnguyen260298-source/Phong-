name: GPR Bronze finalize v2

on:
  push:
    paths:
      - '.github/workflows/gpr-bronze-finalize-v2.yml'
      - 'scripts/gpr_bronze_finalize_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download locked baseline
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ github.token }}
      - name: Download successful Bronze refresh artifact
        uses: actions/download-artifact@v4
        with:
          name: gpr-bronze-continue-final
          path: data/gpr_bronze_refresh
          repository: phongnguyen260298-source/Phong-
          run-id: 34457103163
          github-token: ${{ github.token }}
      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          find data/gpr_bronze_refresh -maxdepth 4 -type f | head -50
          if [ -d data/gpr_bronze_refresh/gpr_bronze_refresh ]; then
            cp -a data/gpr_bronze_refresh/gpr_bronze_refresh/. data/gpr_bronze_refresh/
          fi
          test "$(find data/gpr_bronze_refresh/fundamental_shards -name 'fundamental_shard_*.parquet' | wc -l)" -eq 4
      - name: Install analysis stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' pyarrow scipy linearmodels statsmodels
      - name: Run final robustness and comparison
        run: python scripts/gpr_bronze_finalize_v2.py
      - name: Commit final v2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_bronze_refresh/final
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add final GPR v2 robustness and direction comparison'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-bronze-final-v2
          path: data/gpr_bronze_refresh/final/
          retention-days: 30
