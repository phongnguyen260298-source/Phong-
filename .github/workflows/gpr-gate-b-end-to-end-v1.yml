name: GPR Gate B end-to-end v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpr-gate-b-end-to-end-v1.yml'
      - 'scripts/gpr_gate_b_end_to_end_v1.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  RAW_RUN_ID: 34582712489

jobs:
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download locked raw fundamentals artifact
        uses: actions/download-artifact@v4
        with:
          name: gpr-bronze-refresh-raw
          path: data/gpr_bronze_refresh
          repository: phongnguyen260298-source/Phong-
          run-id: ${{ env.RAW_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Normalize raw artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gpr_bronze_refresh/fundamental_shards
          while IFS= read -r f; do
            parent=$(dirname "$f")
            if [ "$parent" != "data/gpr_bronze_refresh/fundamental_shards" ]; then
              cp "$f" data/gpr_bronze_refresh/fundamental_shards/
            fi
          done < <(find data/gpr_bronze_refresh -name 'fundamental_shard_*.parquet')
          test "$(find data/gpr_bronze_refresh/fundamental_shards -name 'fundamental_shard_*.parquet' | wc -l)" -eq 4

      - name: Install reproducibility stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' pyarrow scipy linearmodels statsmodels

      - name: Run raw-to-WCB Gate B pipeline
        run: python scripts/gpr_gate_b_end_to_end_v1.py

      - name: Show Gate B status
        if: always()
        run: |
          if [ -f data/gpr_gate_b_end_to_end_v1/gate_b_status.json ]; then
            cat data/gpr_gate_b_end_to_end_v1/gate_b_status.json
          fi

      - name: Upload Gate B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpr-gate-b-end-to-end-v1
          path: data/gpr_gate_b_end_to_end_v1/
          retention-days: 90

      - name: Commit PASS evidence
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_gate_b_end_to_end_v1
          if git diff --cached --quiet; then
            echo 'No output changes'
          else
            git commit -m 'Add Gate B end-to-end reproducibility evidence'
            git pull --rebase origin main
            git push
          fi
