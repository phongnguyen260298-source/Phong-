name: GPR DIO VNStock Community extraction

on:
  push:
    paths:
      - 'scripts/gpr_dio_vnstock_community.py'
      - '.github/workflows/gpr-dio-vnstock-community.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-community:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Community VNStock dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'vnstock>=4.0.7' 'vnai>=2.5.9' pandas numpy pyarrow openpyxl

      - name: Apply pandas Period compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/gpr_dio_vnstock_community.py')
          s = p.read_text(encoding='utf-8')
          old = "prev_q = panel.groupby('Symbol')['QuarterP'].shift(1)\nconsecutive = (panel['QuarterP'].astype('int64') - prev_q.astype('Int64')) == 1"
          new = "qparts = panel['Quarter'].str.extract(r'(?P<year>20\\d{2})-Q(?P<quarter>[1-4])').astype(int)\npanel['_q_index'] = qparts['year'] * 4 + qparts['quarter']\nprev_q_index = panel.groupby('Symbol')['_q_index'].shift(1)\nconsecutive = (panel['_q_index'] - prev_q_index).eq(1)"
          if old not in s:
              raise SystemExit('Expected compatibility target not found')
          s = s.replace(old, new)
          marker = "panel['AvgInventory'] = (panel['Inventory_End'] + panel['Inventory_Lag'])/2"
          s = s.replace(marker, "panel.drop(columns=['_q_index'], inplace=True)\n\n" + marker)
          p.write_text(s, encoding='utf-8')
          print('Applied Period compatibility patch')
          PY

      - name: Extract 42-company Community dataset
        run: |
          python scripts/gpr_dio_vnstock_community.py

      - name: Show extraction summary
        if: always()
        run: |
          if [ -f output/community/run_summary.json ]; then
            cat output/community/run_summary.json
          fi

      - name: Upload Community dataset artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpr-dio-vnstock-community
          path: output/community/
          if-no-files-found: warn
          retention-days: 30
