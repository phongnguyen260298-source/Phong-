name: GPR DIO VNStock Bronze extraction

on:
  push:
    paths:
      - 'scripts/gpr_dio_vnstock.py'
      - '.github/workflows/gpr-dio-vnstock.yml'
  workflow_dispatch:

concurrency:
  group: gpr-dio-vnstock-bronze
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check VNStock API key secret
        shell: bash
        run: |
          if [ -z "$VNSTOCK_API_KEY" ]; then
            echo "::error::Repository secret VNSTOCK_API_KEY is not configured."
            exit 2
          fi

      - name: Install VNStock Bronze libraries
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"
          python -m pip install --upgrade pip requests setuptools wheel
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
          chmod +x installer.run
          ./installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$VENV_PATH" --language en

          # Installer uses a uv-managed environment. Bootstrap pip without
          # replacing VNStock-compatible numpy/pandas with incompatible majors.
          "$VENV_PATH/bin/python" -m ensurepip --upgrade
          "$VENV_PATH/bin/python" -m pip install --upgrade \
            'pip<27' 'pandas>=2.0,<3' 'numpy>=1.24,<2.3' pyarrow openpyxl

          "$VENV_PATH/bin/python" - <<'PY'
          from vnstock_data import Finance
          import pandas as pd
          import numpy as np
          print('Bronze vnstock_data import OK')
          print('pandas=', pd.__version__, 'numpy=', np.__version__)
          f = Finance(source='VCI', symbol='HPG')
          bs = f.balance_sheet(period='quarter', lang='vi', drop_empty=False, com_type='Regular', format='long')
          periods = sorted(bs['period'].dropna().astype(str).unique()) if 'period' in bs.columns else []
          print('HPG VCI quarterly periods returned:', len(periods))
          print('HPG VCI first/last:', periods[:3], periods[-3:])
          PY

      - name: Extract Bronze research dataset
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"
          "$VENV_PATH/bin/python" scripts/gpr_dio_vnstock.py

      - name: Show summary
        if: always()
        shell: bash
        run: |
          if [ -f output/run_summary.json ]; then
            cat output/run_summary.json
          fi

      - name: Upload dataset artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpr-dio-vnstock-bronze
          path: output/
          if-no-files-found: warn
          retention-days: 30
