name: GPR market Top5 v5 Bronze full-history

on:
  push:
    paths:
      - '.github/workflows/gpr-market-top5-v3.yml'
      - 'scripts/gpr_market_top5_fetch_shard.py'
      - 'scripts/gpr_market_top5_analyze_v3.py'
      - 'data/research_cohorts/vci578_preexposure.csv'
      - 'data/research_cohorts/vci578_behavioral_groups.csv'
  workflow_dispatch:

concurrency:
  group: gpr-market-top5-v5-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  N_SHARDS: 4
  VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

jobs:
  fetch:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check VNStock API key secret
        shell: bash
        run: |
          if [ -z "$VNSTOCK_API_KEY" ]; then
            echo "::error::Repository secret VNSTOCK_API_KEY is not configured."
            exit 2
          fi

      - name: Install VNStock Bronze libraries
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"
          python -m pip install --upgrade pip requests setuptools wheel
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
          chmod +x installer.run
          ./installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$VENV_PATH" --language en
          "$VENV_PATH/bin/python" -m ensurepip --upgrade
          "$VENV_PATH/bin/python" -m pip install --upgrade 'pip<27' 'pandas>=2.0,<3' 'numpy>=1.24,<2.3'
          "$VENV_PATH/bin/python" - <<'PY'
          from vnstock_data import Quote
          q = Quote(source='VCI')
          df = q.history(symbol='HPG', start='2025-01-01', end='2025-12-31', interval='1D')
          print('Bronze Quote import OK; HPG rows=', len(df))
          if df is None or df.empty:
              raise RuntimeError('Bronze smoke test returned no HPG rows')
          PY

      - name: Fetch full-history shard with Bronze API
        env:
          SHARD: ${{ matrix.shard }}
          N_SHARDS: 4
          REQUEST_INTERVAL: 1.6
          MAX_RETRIES: 6
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/vnstock-venv"
          "$VENV_PATH/bin/python" scripts/gpr_market_top5_fetch_shard.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-v5-shard-${{ matrix.shard }}
          path: data/gpr_market_top5_v4/shards/
          retention-days: 7

  analyze:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy<2.3' statsmodels scipy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: price-v5-shard-*
          path: data/gpr_market_top5_v4/shards
          merge-multiple: true
      - name: Verify shard artifacts
        shell: bash
        run: |
          find data/gpr_market_top5_v4/shards -type f -maxdepth 2 -print
          test "$(find data/gpr_market_top5_v4/shards -name 'price_shard_*.csv.gz' | wc -l)" -ge 4
          test "$(find data/gpr_market_top5_v4/shards -name 'coverage_shard_*.csv' | wc -l)" -ge 4
      - name: Analyze Top5 market reactions
        run: python scripts/gpr_market_top5_analyze_v3.py
      - name: Commit final outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_market_top5_v4/ || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add Bronze full-history GPR market results'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-market-top5-v5-final
          path: data/gpr_market_top5_v4/
          retention-days: 30
