name: VNStock free financial smoke test

on:
  push:
    paths:
      - '.github/workflows/vnstock-free-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core VNStock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'vnstock>=4.0.7' 'vnai>=2.5.9' pandas openpyxl
      - name: HPG financial smoke test
        run: |
          python - <<'PY'
          import os
          from vnstock import register_user, Finance

          key = os.environ.get('VNSTOCK_API_KEY')
          if not key:
              raise SystemExit('VNSTOCK_API_KEY missing')
          print('register_user=', register_user(api_key=key))

          for source in ['KBS','VCI']:
              print('\n=== SOURCE', source, '===')
              try:
                  f = Finance(symbol='HPG', source=source)
                  for method in ['balance_sheet','income_statement']:
                      try:
                          df = getattr(f, method)(period='quarter')
                          print('\n--', method, '--')
                          print('shape=', getattr(df, 'shape', None))
                          print('columns=', list(df.columns))
                          print('attrs=', getattr(df, 'attrs', {}))
                          print(df.head(20).to_string())
                      except Exception as e:
                          print(method, 'ERROR', type(e).__name__, str(e))
              except Exception as e:
                  print('SOURCE ERROR', type(e).__name__, str(e))
          PY
