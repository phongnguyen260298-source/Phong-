name: GPR market reaction to future CFO

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpr-market-future-cfo.yml'
      - 'scripts/gpr_market_future_cfo_v1.py'
      - 'scripts/vci_xy_screen_v1.py'

permissions:
  contents: write
  actions: read

jobs:
  linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' scipy statsmodels linearmodels pyarrow openpyxl
      - name: Download locked VCI v4.2 fundamental artifact
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose VCI report schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for report in ['balance_sheet','income_statement','cash_flow']:
              files=sorted(Path('input/vci42').glob(f'chunk_*/fundamental_quarter/{report}/*.parquet'))
              print('\nREPORT', report, 'FILES', len(files))
              if not files:
                  continue
              d=pd.read_parquet(files[0])
              print('FILE', files[0])
              print('COLUMNS', list(d.columns))
              print('DTYPES', {c:str(t) for c,t in d.dtypes.items()})
              print('HEAD')
              print(d.head(8).to_string())
              obj=[c for c in d.columns if d[c].dtype=='object']
              for c in obj:
                  vals=d[c].dropna().astype(str).drop_duplicates().head(120).tolist()
                  print('OBJECT_VALUES', c, vals)
          PY
      - name: Rebuild locked CFO panel
        run: python scripts/vci_xy_screen_v1.py
      - name: Run market reaction to future CFO linkage
        run: python scripts/gpr_market_future_cfo_v1.py
      - name: Commit linkage outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_market_future_cfo_v1/ || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add market reaction to future CFO results'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-market-future-cfo-results
          path: data/gpr_market_future_cfo_v1/
          retention-days: 30
