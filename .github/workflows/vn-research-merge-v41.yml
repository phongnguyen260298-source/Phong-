name: VN Research Lake Merge v4.1

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed extraction run ID"
        required: true
        default: "34308238188"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/dispatch/vn-research-merge-v41.json"

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve source run
        id: params
        shell: bash
        env:
          INPUT_SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              run_id = os.environ.get("INPUT_SOURCE_RUN") or "34308238188"
          else:
              cfg = json.loads(Path(".github/dispatch/vn-research-merge-v41.json").read_text())
              run_id = str(cfg.get("source_run_id", "34308238188"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"run_id={run_id}", file=f)
          print({"source_run_id": run_id})
          PY

      - name: Install merge dependencies
        run: python -m pip install --upgrade "pandas>=2.2,<3" pyarrow

      - name: Download 7 core artifacts
        shell: bash
        run: |
          set -euo pipefail
          RUN="${{ steps.params.outputs.run_id }}"
          mkdir -p input
          for i in 0 1 2 3 4 5 6; do
            mkdir -p "input/c${i}"
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "vn-research-v41-core-c${i}" -D "input/c${i}"
          done

      - name: Download cohort artifact
        shell: bash
        run: |
          set -euo pipefail
          RUN="${{ steps.params.outputs.run_id }}"
          mkdir -p input/cohort
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "vn-research-cohort-v41" -D input/cohort

      - name: Merge lake and audit coverage
        run: |
          python scripts/vn_research_merge_v41.py \
            --input-root input \
            --cohort-root input/cohort \
            --out output/merged_v41

      - name: Show summary
        run: |
          cat output/merged_v41/merge_summary.json
          echo "--- DATASET SUMMARY ---"
          cat output/merged_v41/dataset_summary.csv
          echo "--- COVERAGE SAMPLE ---"
          head -25 output/merged_v41/coverage_by_symbol.csv

      - name: Upload merged lake
        uses: actions/upload-artifact@v4
        with:
          name: vn-research-v41-merged-lake
          path: output/merged_v41/
          retention-days: 90
          compression-level: 6
