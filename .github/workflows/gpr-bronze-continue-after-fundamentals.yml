name: GPR Bronze continue after fundamentals

on:
  push:
    paths:
      - '.github/workflows/gpr-bronze-continue-after-fundamentals.yml'
      - 'scripts/gpr_bronze_refresh_price_shard.py'
      - 'scripts/gpr_bronze_refresh_compare_v1.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download locked baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ github.token }}

      - name: Download completed Bronze fundamentals from prior run
        uses: actions/download-artifact@v4
        with:
          name: gpr-bronze-refresh-raw
          path: data/gpr_bronze_refresh
          repository: phongnguyen260298-source/Phong-
          run-id: 34444285840
          github-token: ${{ github.token }}

      - name: Install VNStock Bronze once
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VNSTOCK_API_KEY"
          VENV="$RUNNER_TEMP/vnstock-venv"
          python -m pip install --upgrade pip requests setuptools wheel
          wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
          chmod +x installer.run
          ./installer.run -- --non-interactive --api-key "$VNSTOCK_API_KEY" --venv-path "$VENV" --language en
          "$VENV/bin/python" -m ensurepip --upgrade
          "$VENV/bin/python" -m pip install 'pandas>=2.2,<3' 'numpy<2.3' pyarrow scipy linearmodels statsmodels
          "$VENV/bin/python" - <<'PY'
          from vnstock_data import Finance, Quote
          print('VNStock Bronze authenticated environment OK')
          PY

      - name: Normalize downloaded artifact layout
        shell: bash
        run: |
          set -euo pipefail
          find data/gpr_bronze_refresh -maxdepth 3 -type f -print | head -40
          if [ -d data/gpr_bronze_refresh/fundamental_shards ]; then exit 0; fi
          # action artifact may restore the common root directly under target
          mkdir -p data/gpr_bronze_refresh/fundamental_shards
          find data/gpr_bronze_refresh -type f \( -name 'fundamental_shard_*' -o -name 'coverage_shard_*' -o -name 'errors_shard_*' -o -name 'meta_shard_*' \) -exec cp {} data/gpr_bronze_refresh/fundamental_shards/ \;

      - name: Verify completed fundamental shards
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/vnstock-venv"
          test "$(find data/gpr_bronze_refresh/fundamental_shards -name 'fundamental_shard_*.parquet' | wc -l)" -eq 4
          "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('data/gpr_bronze_refresh/fundamental_shards')
          cov=pd.concat([pd.read_csv(f) for f in p.glob('coverage_shard_*.csv')],ignore_index=True)
          err=pd.concat([pd.read_csv(f) for f in p.glob('errors_shard_*.csv')],ignore_index=True)
          print('fundamental firms=',cov.symbol.nunique(),'errors=',len(err))
          if cov.symbol.nunique() != 580:
              raise RuntimeError(f'Expected 580 firms, got {cov.symbol.nunique()}')
          PY

      - name: Fetch all prices on same authenticated device
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/vnstock-venv"
          rm -rf data/gpr_bronze_refresh/price_shards
          mkdir -p data/gpr_bronze_refresh/price_shards
          for SHARD in 0 1 2 3; do
            echo "=== PRICE SHARD $SHARD/4 ==="
            SHARD="$SHARD" N_SHARDS=4 REQUEST_PAUSE=0.45 \
              "$VENV/bin/python" scripts/gpr_bronze_refresh_price_shard.py
          done

      - name: Verify price shards
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/vnstock-venv"
          test "$(find data/gpr_bronze_refresh/price_shards -name 'price_shard_*.parquet' | wc -l)" -eq 4
          "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('data/gpr_bronze_refresh/price_shards')
          cov=pd.concat([pd.read_csv(f) for f in p.glob('coverage_shard_*.csv')],ignore_index=True)
          err=pd.concat([pd.read_csv(f) for f in p.glob('errors_shard_*.csv')],ignore_index=True)
          print('price firms=',cov.symbol.nunique(),'positive history=',int((cov.n>0).sum()),'errors=',len(err))
          if int((cov.n>0).sum()) < 300:
              raise RuntimeError('Price coverage below 300 firms')
          PY

      - name: Validate refreshed data, groups, DID and AI-GPR measurement
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vnstock-venv/bin/python" scripts/gpr_bronze_refresh_compare_v1.py

      - name: Price QA
        shell: bash
        run: |
          "$RUNNER_TEMP/vnstock-venv/bin/python" - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          fs=list(Path('data/gpr_bronze_refresh/price_shards').glob('price_shard_*.parquet'))
          if not fs: raise RuntimeError('No refreshed price shards')
          p=pd.concat([pd.read_parquet(f) for f in fs],ignore_index=True)
          p['date']=pd.to_datetime(p.date,errors='coerce')
          q={'rows':len(p),'symbols':int(p.symbol.nunique()),'start':str(p.date.min().date()),'end':str(p.date.max().date()),'duplicate_symbol_date':int(p.duplicated(['symbol','date']).sum()),'missing_close':float(p.close.isna().mean())}
          Path('data/gpr_bronze_refresh/final').mkdir(parents=True,exist_ok=True)
          Path('data/gpr_bronze_refresh/final/price_qa.json').write_text(json.dumps(q,indent=2),encoding='utf-8'); print(q)
          PY

      - name: Commit refreshed validation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_bronze_refresh/final || true
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add completed Bronze refreshed GPR validation results'
            git pull --rebase origin main
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-bronze-continue-final
          path: data/gpr_bronze_refresh/
          retention-days: 30
