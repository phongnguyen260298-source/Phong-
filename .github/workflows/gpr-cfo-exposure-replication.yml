name: GPR CFO exposure replication

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpr-cfo-exposure-replication.yml'
      - 'scripts/gpr_cfo_exposure_replication_v2.py'
      - 'scripts/build_cfo_linkage_panel.py'

permissions:
  contents: write
  actions: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: python -m pip install --upgrade pip 'pandas>=2.2,<3' 'numpy<2.3' scipy statsmodels linearmodels pyarrow openpyxl
      - name: Download locked VCI v4.2 fundamental artifact
        uses: actions/download-artifact@v4
        with:
          name: vn-research-v42-vci-full
          path: input/vci42
          repository: phongnguyen260298-source/Phong-
          run-id: 34329813990
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CFO panel
        run: python scripts/build_cfo_linkage_panel.py
      - name: Rebuild pre-2020 exposure and replicate H1 H2
        run: python scripts/gpr_cfo_exposure_replication_v2.py
      - name: Commit replication outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gpr_cfo_exposure_replication_v2/ || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add GPR CFO exposure replication results'; git pull --rebase origin main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-cfo-exposure-replication-results
          path: data/gpr_cfo_exposure_replication_v2/
          retention-days: 30
